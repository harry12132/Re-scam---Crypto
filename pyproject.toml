[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rescam-crypto"
version = "0.1.0"
description = "Crypto scam-awareness simulation and visit notification tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "qrcode[pil]>=7.4,<9.0",
]

[project.scripts]
rescam = "rescam.cli:main"

[tool.setuptools.packages.find]
include = ["rescam*"]
